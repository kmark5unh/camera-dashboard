version: '3.8'

services:
  camera-dashboard:
    image: python:3.11-slim
    container_name: camera_dashboard
    ports:
      - "8000:8000"
    volumes:
      - camera_data:/data
    environment:
      EXACQ_SERVER: "${EXACQ_SERVER}"
      EXACQ_USER: "${EXACQ_USER}"
      EXACQ_PASS: "${EXACQ_PASS}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      EMAIL_TO: "${EMAIL_TO}"
      BLUR_THRESHOLD: "${BLUR_THRESHOLD:-100.0}"
      SCRIPT_URL: "${SCRIPT_URL}"
    command: sh -c "${STARTUP_COMMAND}"
    restart: always

volumes:
  camera_data:

version: '3.8'

services:
  camera-dashboard:
    image: python:3.11-slim
    container_name: camera_dashboard
    ports:
      - "8000:8000"
    volumes:
      - camera_data:/data
    environment:
      EXACQ_SERVER: "${EXACQ_SERVER}"
      EXACQ_USER: "${EXACQ_USER}"
      EXACQ_PASS: "${EXACQ_PASS}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      EMAIL_TO: "${EMAIL_TO}"
      BLUR_THRESHOLD: "${BLUR_THRESHOLD:-100.0}"
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn requests apscheduler sqlite-utils opencv-python-headless numpy &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: always

volumes:
  camera_data:

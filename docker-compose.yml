version: '3.8'

services:
  camera-dashboard:
    build: .
    container_name: camera_dashboard
    ports:
      - "8000:8000"
    volumes:
      - camera_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      environment:
      - EXACQ_SERVER=https://SERVER1_IP:8000,https://SERVER2_IP:8000
      - EXACQ_PASS=${EXACQ_PASS}
      - SMTP_HOST=localhost
      - SMTP_PORT=25
      - SMTP_USER=disabled@university.edu
      - SMTP_PASS=disabled
      - EMAIL_TO=admin@university.edu
      - BLUR_THRESHOLD=100.0
    restart: always

volumes:
  camera_data:

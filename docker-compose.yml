version: '3.8'

services:
  camera-dashboard:
    build: .
    container_name: camera_dashboard
    ports:
      - "8000:8000"
    volumes:
      - camera_data:/data
    environment:
      EXACQ_SERVER: "${EXACQ_SERVER}"
      EXACQ_USER: "camera-dashboard"
      EXACQ_PASS: "${EXACQ_PASS}"
      SMTP_HOST: "smtp.university.edu"
      SMTP_PORT: "587"
      SMTP_USER: "disabled@university.edu"
      SMTP_PASS: "disabled"
      EMAIL_TO: "admin@university.edu"
      BLUR_THRESHOLD: "100.0"
    restart: always

volumes:
  camera_data:
